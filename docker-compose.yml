services:
  portfolio-tracker:
    image: kpa90/portfolio-tracker:latest
    container_name: portfolio-tracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Warsaw
      # Klucze zdefiniuj w Portainerze lub pliku .env — nigdy nie wpisuj ich do repozytorium:
      - EODHD_API_KEY=${EODHD_API_KEY:-}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - EODHD_MIN_INTERVAL_SECONDS=${EODHD_MIN_INTERVAL_SECONDS:-1}
      - ALPHAVANTAGE_MIN_INTERVAL_SECONDS=${ALPHAVANTAGE_MIN_INTERVAL_SECONDS:-12}
      # Wyłącz wewnętrzny harmonogram, gdy refresh i backup wywołuje zewnętrzna automatyzacja:
      - SCHEDULER_ENABLED=false
      # Godzina codziennego odświeżania cen/kursów (czas TZ):
      - REFRESH_HOUR=21
      - REFRESH_MINUTE=0
      # Godzina nocnego backupu bazy + ile kopii trzymać:
      - BACKUP_HOUR=3
      - BACKUP_MINUTE=0
      - BACKUP_KEEP=14
      # UI ostrzega, jeśli ostatnia poprawna kopia jest starsza niż ten próg:
      - BACKUP_STALE_HOURS=36
    volumes:
      - portfolio_tracker_data:/app/data

volumes:
  portfolio_tracker_data:
